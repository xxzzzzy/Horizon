name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. Asia/Shanghai is UTC+8, so the
    # Beijing 07:5x run lands on the previous UTC date. We (1) offset far off
    # the top of the hour (:58) to dodge GitHub's busy :00 schedule slot and
    # queueing delays, and (2) label the digest by Asia/Shanghai date via
    # HORIZON_SUMMARY_DATE so the morning post reads as "today" in Beijing.
    - cron: '58 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          # Label the digest by Asia/Shanghai date (not UTC), so the 07:1x
          # Beijing run produces a post dated "today" for the reader.
          export HORIZON_SUMMARY_DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          uv run horizon --hours 24

      - name: Set current date (Asia/Shanghai) as environment variable
        run: echo "DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
